<svg viewBox="0 0 1000 1000" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Patch system layering: editor, runtime graph, binding bridge, DSP memory, DSP objects, with patch save/load looping back to the runtime graph</title>
<desc>A vertical stack of five layers from human-facing editor down to low-level DSP objects, with a binding layer highlighted as the only bridge between them, and a patch JSON load/save loop connecting back into the runtime graph layer.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#8a93b8"/>
</marker>
<marker id="arrowAccent" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
<path d="M0,0 L10,5 L0,10 z" fill="#e2a86d"/>
</marker>
</defs>

<rect width="1000" height="1000" fill="#12152a"/>

<text x="500" y="55" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="30" font-weight="700" fill="#ffffff">Patch System: five layers, one bridge</text>
<text x="500" y="86" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="16" fill="#9aa0c0">Humans see nodes and wires. The machine sees arrays, slots, and ordered work.</text>

<!-- Layer boxes -->
<g font-family="Segoe UI, Verdana, sans-serif">

  <!-- 1 Human / Editor -->
  <rect x="140" y="130" width="720" height="110" rx="14" fill="#1c2140" stroke="#3a4070" stroke-width="2"/>
  <text x="500" y="172" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Human / Editor Layer</text>
  <text x="500" y="200" text-anchor="middle" font-size="15" fill="#b8bede">nodes · ports · wires · presets · scopes</text>

  <line x1="500" y1="240" x2="500" y2="272" stroke="#8a93b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 2 Circuit / Runtime Graph -->
  <rect x="140" y="272" width="720" height="110" rx="14" fill="#1c2140" stroke="#3a4070" stroke-width="2"/>
  <text x="500" y="314" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Circuit / Runtime Graph</text>
  <text x="500" y="342" text-anchor="middle" font-size="15" fill="#b8bede">structure, stable IDs, validation, serialization</text>

  <line x1="500" y1="382" x2="500" y2="414" stroke="#e2a86d" stroke-width="3" marker-end="url(#arrowAccent)"/>

  <!-- 3 Binding Layer (accent) -->
  <rect x="140" y="414" width="720" height="110" rx="14" fill="#332a1f" stroke="#e2a86d" stroke-width="3"/>
  <text x="500" y="456" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">Binding Layer — the only bridge</text>
  <text x="500" y="484" text-anchor="middle" font-size="15" fill="#f0d8b8">syncs runtime params into external memory</text>

  <line x1="500" y1="524" x2="500" y2="556" stroke="#8a93b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 4 DSP Memory -->
  <rect x="140" y="556" width="720" height="110" rx="14" fill="#1c2140" stroke="#3a4070" stroke-width="2"/>
  <text x="500" y="598" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">DSP Memory / State</text>
  <text x="500" y="626" text-anchor="middle" font-size="15" fill="#b8bede">contiguous, stable slots — SIMD-ready</text>

  <line x1="500" y1="666" x2="500" y2="698" stroke="#8a93b8" stroke-width="3" marker-end="url(#arrow)"/>

  <!-- 5 DSP Objects -->
  <rect x="140" y="698" width="720" height="110" rx="14" fill="#1c2140" stroke="#3a4070" stroke-width="2"/>
  <text x="500" y="740" text-anchor="middle" font-size="22" font-weight="700" fill="#ffffff">DSP Objects</text>
  <text x="500" y="768" text-anchor="middle" font-size="15" fill="#b8bede">plain, fast, UI-blind — oscillators, filters, envelopes</text>

</g>

<!-- Patch load/save loop, feeding layer 2 -->
<g font-family="Segoe UI, Verdana, sans-serif">
  <path d="M 140 327 C 60 327, 60 900, 500 900 L 500 848" fill="none" stroke="#7fc7d9" stroke-width="3" marker-end="url(#arrow)"/>
  <rect x="330" y="852" width="340" height="80" rx="14" fill="#16233a" stroke="#7fc7d9" stroke-width="2"/>
  <text x="500" y="884" text-anchor="middle" font-size="18" font-weight="700" fill="#ffffff">Patch JSON</text>
  <text x="500" y="908" text-anchor="middle" font-size="14" fill="#a9d3de">load / save / edit</text>
</g>

<text x="500" y="970" text-anchor="middle" font-family="Segoe UI, Verdana, sans-serif" font-size="14" fill="#6a7098">Circuit does not own DSP objects. DSP objects do not know Circuit. Binding is the bridge.</text>

</svg>
