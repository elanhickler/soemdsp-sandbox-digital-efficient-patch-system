<svg viewBox="0 0 900 320" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="analogWire" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7fc7d9"/>
      <stop offset="100%" stop-color="#e2a86d"/>
    </linearGradient>
    <style>
      text { font-family: Segoe UI, Verdana, sans-serif; }
      .lbl { fill: #e8e8f0; font-size: 15px; }
      .cap { fill: #9aa0c0; font-size: 13px; }
      .h   { fill: #ffffff; font-size: 20px; font-weight: 700; }
    </style>
  </defs>
  <rect width="900" height="320" fill="#12152a"/>

  <text x="30" y="40" class="h">Two signal types, one wire</text>

  <!-- Analog wire -->
  <text x="30" y="90" class="lbl">Analog CV / audio</text>
  <line x1="30" y1="110" x2="500" y2="110" stroke="url(#analogWire)" stroke-width="4"/>
  <circle cx="30" cy="110" r="6" fill="#7fc7d9"/>
  <circle cx="500" cy="110" r="6" fill="#e2a86d"/>
  <text x="30" y="135" class="cap">a free-form float — pitch, gain, phase, whatever the graph wants</text>

  <!-- Digital wire -->
  <text x="30" y="185" class="lbl">Digital signal (bitmask / 0.1V-Oct)</text>
  <line x1="30" y1="205" x2="500" y2="205" stroke="#ffffff" stroke-width="4"/>
  <circle cx="30" cy="205" r="6" fill="#ffffff"/>
  <circle cx="500" cy="205" r="6" fill="#ffffff"/>
  <text x="30" y="230" class="cap">the same float, read as fixed bits — 000101100000 = C, D#, F#, A</text>

  <!-- bit boxes -->
  <g font-family="Consolas, monospace" font-size="16" fill="#0f1220">
    <g transform="translate(560,180)">
      <text x="0" y="-10" class="cap" fill="#9aa0c0">12-bit pitch-class mask</text>
      <rect x="0" y="0" width="26" height="26" fill="#ffffff"/><text x="7" y="19">1</text>
      <rect x="26" y="0" width="26" height="26" fill="#2a2f52"/><text x="33" y="19" fill="#e8e8f0">0</text>
      <rect x="52" y="0" width="26" height="26" fill="#2a2f52"/><text x="59" y="19" fill="#e8e8f0">0</text>
      <rect x="78" y="0" width="26" height="26" fill="#ffffff"/><text x="85" y="19">1</text>
      <rect x="104" y="0" width="26" height="26" fill="#2a2f52"/><text x="111" y="19" fill="#e8e8f0">0</text>
      <rect x="130" y="0" width="26" height="26" fill="#2a2f52"/><text x="137" y="19" fill="#e8e8f0">0</text>
      <rect x="156" y="0" width="26" height="26" fill="#ffffff"/><text x="163" y="19">1</text>
      <rect x="182" y="0" width="26" height="26" fill="#2a2f52"/><text x="189" y="19" fill="#e8e8f0">0</text>
      <rect x="208" y="0" width="26" height="26" fill="#2a2f52"/><text x="215" y="19" fill="#e8e8f0">0</text>
      <rect x="234" y="0" width="26" height="26" fill="#2a2f52"/><text x="241" y="19" fill="#e8e8f0">0</text>
      <rect x="260" y="0" width="26" height="26" fill="#2a2f52"/><text x="267" y="19" fill="#e8e8f0">0</text>
      <rect x="286" y="0" width="26" height="26" fill="#2a2f52"/><text x="293" y="19" fill="#e8e8f0">0</text>
    </g>
  </g>

  <text x="30" y="275" class="cap">Up to 53 safe-integer bits fit on one JS-float wire — this sandbox uses 12 so far.</text>
</svg>
